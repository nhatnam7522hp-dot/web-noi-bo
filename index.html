<!DOCTYPE html>
 <html lang="vi">
 <head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Quản Lý Nhập Hàng & Đồng Bộ Firebase</title> 
<style> * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; } body { background-color: #f4f6f9; padding: 20px; } .container { max-width: 950px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); } h2 { text-align: center; color: #333; margin-bottom: 20px; } .section-title { margin-top: 20px; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #007bff; color: #007bff; font-size: 18px; } .form-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px; } .input-box { display: flex; flex-direction: column; } .input-box label { font-size: 14px; margin-bottom: 5px; font-weight: bold; color: #555; } .input-box input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; } .btn-add { background-color: #28a745; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; margin-bottom: 10px; } .btn-add:hover { background-color: #218838; } .search-box { margin-bottom: 15px; display: flex; gap: 10px; } .search-box input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; } table { width: 100%; border-collapse: collapse; margin-top: 10px; } th, td { border: 1px solid #ddd; padding: 10px; text-align: center; } th { background-color: #007bff; color: white; } tr:nth-child(even) { background-color: #f9f9f9; } .btn-delete { background-color: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; } .btn-delete:hover { background-color: #c82333; } 
</style>
 </head>

 <body> <div class="container">
 <h2>QUẢN LÝ NHẬP HÀNG & GIÁ BÁN (FIREBASE)</h2> 
<!-- 1. FORM NHẬP HÀNG -->
 <h3 class="section-title">1. Nhập thông tin sản phẩm</h3> 
<form id="productForm"> <div class="form-group"> <div class="input-box"> 

<label>Tên sản phẩm (*)</label>
 <input type="text" id="productName" placeholder="Ví dụ: Áo thun" required> </div> <div class="input-box"> <label>Số lượng (*)</label> <input type="number" id="quantity" min="1" value="1" required> </div> <div class="input-box"> <label>Giá nhập VND (*)</label> <input type="number" id="importPrice" min="0" placeholder="20000" required> </div> <div class="input-box"> <label>% Lợi nhuận (*)</label> <input type="number" id="profitMargin" min="0" value="20" required> </div> </div> <button type="submit" class="btn-add">+ Thêm Lên Đám Mây</button> </form> <!-- 2. BẢNG HIỂN THỊ & TÌM KIẾM --> <h3 class="section-title">2. Danh sách hàng đã nhập (Thời gian thực)</h3> <div class="search-box"> <input type="text" id="searchInput" placeholder="Nhập tên sản phẩm cần tìm kiếm..." oninput="renderTable()"> </div> <table> <thead> <tr> <th>STT</th> <th>Tên sản phẩm</th> <th>Số lượng</th> <th>Giá nhập</th> <th>Thành tiền nhập</th>
 <th>Giá bán gợi ý</th> <th>Thao tác</th> </tr> </thead> <tbody id="inventoryList"> <tr><td colspan="7" style="color: #777;">Đang tải dữ liệu từ Firebase...</td></tr> </tbody> </table> </div> 

<!-- KẾT NỐI FIREBASE & XỬ LÝ LOGIC -->
 <script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
 import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"; 

// Cấu hình Firebase của bạn-->
 const firebaseConfig = { apiKey: "AIzaSyBQRIEvpHRIKHfNINrMbiuBPUlbkjC3RjM", authDomain: "my-new-web-ban-hang.firebaseapp.com", projectId: "my-new-web-ban-hang", storageBucket: "my-new-web-ban-hang.firebasestorage.app", messagingSenderId: "388339723027", appId: "1:388339723027:web:8e18f62b18bc4e8c4c88e6" }; const app = initializeApp(firebaseConfig);
 const db = getFirestore(app); 

let globalInventory = []; function formatMoney(amount) { return new Intl.NumberFormat('vi-VN').format(amount) + " đ"; } 

// 1. LẤNG NGHE DỮ LIỆU THỜI GIAN THỰC TỪ FIREBASE-->
 (COLLECTION: inventory) 
const inventoryQuery = query(collection(db, "inventory"));
onSnapshot(inventoryQuery, (snapshot) => { globalInventory = []; 
snapshot.forEach((docSnap) => { globalInventory.push({ id: docSnap.id, ...docSnap.data() }); });
 renderTable(); }, (error) => { console.error("Lỗi tải dữ liệu: ", error); 
document.getElementById("inventoryList").innerHTML = `<tr><td colspan="7" style="color: red;
">Không thể tải dữ liệu từ Firebase. Hãy kiểm tra lại Rules!</td></tr>`; }); 

// 2. THÊM SẢN PHẨM MỚI LÊN FIREBASE-->
 document.getElementById("productForm").addEventListener("submit", async function(event) { event.preventDefault(); 
 const name = document.getElementById("productName").value.trim(); 
 const quantity = Number(document.getElementById("quantity").value); const importPrice = Number(document.getElementById("importPrice").value); 
 const profitMargin = Number(document.getElementById("profitMargin").value); 
 const totalImport = quantity * importPrice; 
 const sellingPrice = importPrice + (importPrice * (profitMargin / 100)); 
 try { await addDoc(collection(db, "inventory"), { name, quantity, importPrice, totalImport, sellingPrice, createdAt: new Date() }); 

// Reset form sau khi thêm thành công-->
 document.getElementById("productForm").reset(); document.getElementById("quantity").value = "1"; document.getElementById("profitMargin").value = "20"; document.getElementById("productName").focus(); } catch (e) { console.error("Lỗi khi thêm: ", e); alert("Thêm sản phẩm thất bại!"); } }); 

// 3. XÓA SẢN PHẨM TRÊN FIREBASE-->
 window.deleteProduct = async function(id) { if (confirm("Bạn có chắc muốn xóa sản phẩm này?")) { try { await deleteDoc(doc(db, "inventory", id)); }
 catch (e) { console.error("Lỗi khi xóa: ", e); alert("Xóa thất bại!"); } } };

 // 4. HÀM HIỂN THỊ VÀ LỌC TÌM KIẾM-->
 window.renderTable = function() { const tbody = document.getElementById("inventoryList");
 tbody.innerHTML = "";
 const keyword = document.getElementById("searchInput").value.toLowerCase().trim(); 
 const filteredList = globalInventory.filter(item => item.name.toLowerCase().includes(keyword)); if (filteredList.length === 0) { tbody.innerHTML = `<tr><td colspan="7" style="color: #777;
">Không tìm thấy sản phẩm phù hợp.</td></tr>`; return; } filteredList.forEach((item, index) => { const row = document.createElement("tr"); row.innerHTML = ` <td>${index + 1}</td> <td style="text-align: left;"><b>${item.name}</b></td> <td>${item.quantity}</td> <td>${formatMoney(item.importPrice)}</td> <td>${formatMoney(item.totalImport)}</td> 
<td style="color: #28a745; font-weight: bold;">${formatMoney(item.sellingPrice)}</td>
 <td><button class="btn-delete" onclick="deleteProduct('${item.id}')">Xóa</button></td> `; 
tbody.appendChild(row); }); };
 </script>
 </body> 
</html>
